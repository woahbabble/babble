<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Babble</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 14px;
    }

    #header {
      padding: 14px 16px;
      border-bottom: 1px solid #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
    }

    #header h1 {
      font-size: 18px;
      font-weight: 700;
      color: #ff6b35;
      letter-spacing: -0.5px;
    }

    #header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #theme-quick-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #666;
    }

    #theme-select-quick {
      width: auto;
      margin: 0;
      padding: 2px 4px;
      font-size: 11px;
    }

    #view-tabs {
      display: flex;
      gap: 4px;
    }

    .tab-btn {
      background: none;
      border: none;
      color: #666;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .tab-btn.active {
      background: #ff6b35;
      color: white;
    }

    .tab-btn:hover:not(.active) {
      background: #f0f0f0;
    }

    #user-info {
      font-size: 12px;
      color: #666;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.8; }

    #logout-btn {
      background: none;
      color: #999;
      padding: 4px 8px;
      font-size: 12px;
    }

    #auth-section {
      padding: 20px 16px;
      border-bottom: 1px solid #e8e8e8;
    }

    #auth-section h2 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 8px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: #ff6b35; }

    #login-btn {
      background: #ff6b35;
      color: white;
      width: 100%;
      padding: 8px;
      margin-bottom: 6px;
    }

    #signup-btn {
      background: #f5f5f5;
      color: #333;
      width: 100%;
      padding: 8px;
    }

    #url-bar {
      padding: 10px 16px;
      background: #f9f9f9;
      border-bottom: 1px solid #e8e8e8;
      font-size: 11px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #url-actions {
      padding: 8px 16px;
      border-bottom: 1px solid #e8e8e8;
      background: #fff;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-link {
      font-size: 12px;
      color: #ff6b35;
      text-decoration: none;
      display: inline-block;
      width: fit-content;
    }

    .action-link:hover {
      text-decoration: underline;
    }

    #settings-toggle {
      background: none;
      color: #666;
      font-size: 12px;
      padding: 0;
      text-align: left;
    }

    #settings-panel {
      display: none;
      border: 1px solid #e8e8e8;
      border-radius: 6px;
      padding: 8px;
    }

    #settings-panel input {
      margin-bottom: 6px;
      font-size: 12px;
      padding: 6px 8px;
    }

    #pit-mode-row {
      margin-top: 8px;
      font-size: 12px;
      color: #666;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #sort-row {
      margin-top: 8px;
      font-size: 12px;
      color: #666;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #comment-sort-select {
      width: auto;
      margin: 0;
      padding: 2px 6px;
      font-size: 12px;
    }

    #pit-mode-checkbox {
      width: auto;
      margin: 0;
    }

    .settings-actions {
      display: flex;
      gap: 6px;
    }

    .settings-actions button {
      background: #f5f5f5;
      color: #333;
      font-size: 11px;
      padding: 4px 8px;
    }

    #config-status {
      display: none;
      font-size: 11px;
      margin-top: 6px;
    }

    .content-section {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
    }

    .content-section.active {
      display: block;
    }

    .feed-item {
      padding: 12px;
      border: 1px solid #e8e8e8;
      border-radius: 6px;
      margin-bottom: 8px;
      background: white;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .feed-item:hover {
      border-color: #ff6b35;
    }

    .feed-url {
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
      word-break: break-all;
    }

    .feed-stats {
      font-size: 11px;
      color: #999;
    }

    .comment {
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid #f0f0f0;
    }

    .comment:last-child { border-bottom: none; }

    .comment-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .comment-username {
      font-weight: 600;
      font-size: 12px;
      color: #ff6b35;
    }

    .comment-time {
      font-size: 11px;
      color: #bbb;
    }

    .comment-body {
      font-size: 13px;
      line-height: 1.5;
      color: #333;
    }

    .comment-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .vote-rail {
      width: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .vote-btn {
      background: none;
      color: #999;
      font-size: 11px;
      padding: 0;
      line-height: 1;
      border-radius: 0;
    }

    .vote-btn.vote-up.active { color: #d35400; }
    .vote-btn.vote-down.active { color: #3b82f6; }

    .vote-score {
      font-size: 11px;
      font-weight: 700;
      color: #777;
      min-height: 1em;
      margin: 1px 0;
    }

    .comment-main {
      min-width: 0;
      flex: 1;
    }

    .comment.pit-low-quality .comment-body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      opacity: 0.65;
    }

    .comment-quote-wrap {
      margin: 6px 0;
    }

    .comment-quote-label {
      font-size: 10px;
      color: #999;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .comment-quote {
      margin: 0;
      padding: 4px 8px;
      border-left: 2px solid #d0d8e5;
      background: #f5f7fb;
      font-size: 12px;
      color: #4b5567;
      white-space: pre-wrap;
    }

    .reply-btn {
      background: none;
      color: #aaa;
      font-size: 11px;
      padding: 2px 4px;
      margin-top: 4px;
    }

    .reply-btn:hover { color: #ff6b35; }

    .report-btn {
      background: none;
      color: #aaa;
      font-size: 11px;
      padding: 2px 4px;
      margin-top: 4px;
      margin-left: 6px;
    }

    .report-btn:hover { color: #e53e3e; }

    .reply {
      margin-left: 16px;
      padding-left: 12px;
      border-left: 2px solid #f0f0f0;
    }

    #compose {
      padding: 12px 16px;
      border-top: 1px solid #e8e8e8;
      background: #fff;
    }

    #comment-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      resize: none;
      height: 70px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    #comment-input:focus { border-color: #ff6b35; }

    #compose-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    #reply-indicator {
      font-size: 11px;
      color: #888;
    }

    #quote-help {
      font-size: 11px;
      color: #888;
      margin-top: 6px;
    }

    #cancel-reply {
      background: none;
      color: #aaa;
      font-size: 11px;
      padding: 2px 4px;
      display: none;
    }

    #submit-btn {
      background: #ff6b35;
      color: white;
      padding: 7px 16px;
    }

    #empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #bbb;
    }

    #empty-state p { font-size: 13px; line-height: 1.6; }

    #error-msg {
      color: #e53e3e;
      font-size: 12px;
      margin-top: 6px;
      display: none;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #bbb;
      font-size: 13px;
    }

    #sync-toast {
      position: fixed;
      bottom: 12px;
      right: 12px;
      max-width: 260px;
      background: rgba(20, 24, 34, 0.95);
      color: #fff;
      font-size: 12px;
      line-height: 1.35;
      padding: 8px 10px;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 9999;
    }

    #sync-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .quote-btn {
      background: none;
      color: #aaa;
      font-size: 11px;
      padding: 2px 4px;
      margin-top: 4px;
      margin-left: 6px;
    }

    .quote-btn:hover { color: #ff6b35; }

    #theme-row {
      margin-top: 8px;
      font-size: 12px;
      color: #666;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #theme-select {
      width: auto;
      margin: 0;
      padding: 2px 6px;
      font-size: 12px;
    }

    html[data-theme="midnight"] body,
    html[data-theme="dusk"] body,
    html[data-theme="clay"] body,
    html[data-theme="fjord"] body,
    html[data-theme="violet"] body {
      color: #e5eaf5;
      background: #151922;
    }

    html[data-theme="midnight"] #header,
    html[data-theme="dusk"] #header,
    html[data-theme="clay"] #header,
    html[data-theme="fjord"] #header,
    html[data-theme="violet"] #header,
    html[data-theme="midnight"] #url-actions,
    html[data-theme="dusk"] #url-actions,
    html[data-theme="clay"] #url-actions,
    html[data-theme="fjord"] #url-actions,
    html[data-theme="violet"] #url-actions,
    html[data-theme="midnight"] #compose,
    html[data-theme="dusk"] #compose,
    html[data-theme="clay"] #compose,
    html[data-theme="fjord"] #compose,
    html[data-theme="violet"] #compose {
      background: #1d2430;
      border-color: #2f3848;
    }

    html[data-theme="midnight"] #url-bar,
    html[data-theme="dusk"] #url-bar,
    html[data-theme="clay"] #url-bar,
    html[data-theme="fjord"] #url-bar,
    html[data-theme="violet"] #url-bar {
      background: #171d28;
      border-color: #2f3848;
      color: #9fb0cb;
    }

    html[data-theme="midnight"] .action-link,
    html[data-theme="dusk"] .action-link,
    html[data-theme="clay"] .action-link,
    html[data-theme="fjord"] .action-link,
    html[data-theme="violet"] .action-link,
    html[data-theme="midnight"] .comment-username,
    html[data-theme="dusk"] .comment-username,
    html[data-theme="clay"] .comment-username,
    html[data-theme="fjord"] .comment-username,
    html[data-theme="violet"] .comment-username {
      color: #8fb2ff;
    }
  </style>
</head>
<body>

  <div id="header">
    <h1>Babble</h1>
    <div id="header-right">
      <div id="view-tabs">
        <button id="comments-tab" class="tab-btn active">Comments</button>
        <button id="feed-tab" class="tab-btn">Feed</button>
      </div>
      <label id="theme-quick-wrap" for="theme-select-quick">
        Theme
        <select id="theme-select-quick">
          <option value="paper">Paper</option>
          <option value="midnight">Midnight</option>
          <option value="dusk">Dusk</option>
          <option value="clay">Clay</option>
          <option value="fjord">Fjord</option>
          <option value="violet">Violet</option>
        </select>
      </label>
      <span id="user-info"></span>
      <button id="logout-btn" style="display:none">logout</button>
    </div>
  </div>

  <div id="auth-section" style="display:none">
    <h2 id="auth-title">Log in to Babble</h2>
    <input type="text" id="username-input" placeholder="Username" style="display:none">
    <input type="email" id="email-input" placeholder="Email">
    <input type="password" id="password-input" placeholder="Password">
    <button id="login-btn">Log in</button>
    <button id="signup-btn">Create account</button>
    <div id="error-msg"></div>
  </div>

  <div id="url-bar"></div>
  <div id="url-actions">
    <a id="open-thread-link" class="action-link" href="#" target="_blank" rel="noreferrer">open thread on web</a>
    <a id="open-account-link" class="action-link" href="#" target="_blank" rel="noreferrer">open account on web</a>
    <button id="settings-toggle">connection settings</button>
    <div id="settings-panel">
      <input id="api-base-input" type="text" placeholder="API base (e.g. https://babble.local:3001/api)">
      <input id="website-base-input" type="text" placeholder="Website base (e.g. http://localhost:3000)">
      <div class="settings-actions">
        <button id="save-config-btn">save</button>
        <button id="test-api-btn">test api</button>
      </div>
      <label id="pit-mode-row" for="pit-mode-checkbox">
        <input id="pit-mode-checkbox" type="checkbox">
        Enter The Pit
      </label>
      <label id="sort-row" for="comment-sort-select">
        Sort comments
        <select id="comment-sort-select">
          <option value="top">Top</option>
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
        </select>
      </label>
      <label id="sort-row" for="feed-sort-select">
        Sort feed
        <select id="feed-sort-select">
          <option value="popular">Popular</option>
          <option value="active">Active</option>
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
        </select>
      </label>
      <label id="theme-row" for="theme-select">
        Theme
        <select id="theme-select">
          <option value="paper">Paper</option>
          <option value="midnight">Midnight</option>
          <option value="dusk">Dusk</option>
          <option value="clay">Clay</option>
          <option value="fjord">Fjord</option>
          <option value="violet">Violet</option>
        </select>
      </label>
      <div id="config-status"></div>
    </div>
  </div>

  <div id="comments-section" class="content-section active">
    <div class="loading">Loading comments...</div>
  </div>

  <div id="feed-section" class="content-section">
    <div class="loading">Loading feed...</div>
  </div>

  <div id="compose" style="display:none">
    <textarea id="comment-input" placeholder="What do you think?"></textarea>
    <div id="compose-footer">
      <div>
        <span id="reply-indicator"></span>
        <button id="cancel-reply">cancel reply</button>
        <button id="quote-selection-btn">quote page selection</button>
      </div>
      <button id="submit-btn">Post</button>
    </div>
    <div id="quote-help">Tip: select text on the page then click "quote page selection".</div>
  </div>
  <div id="sync-toast" aria-live="polite" aria-atomic="true"></div>

  <script src="env.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
