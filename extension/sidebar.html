<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Babble</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 14px;
    }

    #header {
      padding: 14px 16px;
      border-bottom: 1px solid #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
    }

    #header h1 {
      font-size: 18px;
      font-weight: 700;
      color: #ff6b35;
      letter-spacing: -0.5px;
    }

    #header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #user-info {
      font-size: 12px;
      color: #666;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.8; }

    #logout-btn {
      background: none;
      color: #999;
      padding: 4px 8px;
      font-size: 12px;
    }

    #auth-section {
      padding: 20px 16px;
      border-bottom: 1px solid #e8e8e8;
    }

    #auth-section h2 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 8px;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: #ff6b35; }

    #login-btn {
      background: #ff6b35;
      color: white;
      width: 100%;
      padding: 8px;
      margin-bottom: 6px;
    }

    #signup-btn {
      background: #f5f5f5;
      color: #333;
      width: 100%;
      padding: 8px;
    }

    #url-bar {
      padding: 10px 16px;
      background: #f9f9f9;
      border-bottom: 1px solid #e8e8e8;
      font-size: 11px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #comments-section {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
    }

    .comment {
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid #f0f0f0;
    }

    .comment:last-child { border-bottom: none; }

    .comment-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .comment-username {
      font-weight: 600;
      font-size: 12px;
      color: #ff6b35;
    }

    .comment-time {
      font-size: 11px;
      color: #bbb;
    }

    .comment-body {
      font-size: 13px;
      line-height: 1.5;
      color: #333;
    }

    .reply-btn {
      background: none;
      color: #aaa;
      font-size: 11px;
      padding: 2px 4px;
      margin-top: 4px;
    }

    .reply-btn:hover { color: #ff6b35; }

    .reply {
      margin-left: 16px;
      padding-left: 12px;
      border-left: 2px solid #f0f0f0;
    }

    #compose {
      padding: 12px 16px;
      border-top: 1px solid #e8e8e8;
      background: #fff;
    }

    #comment-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      resize: none;
      height: 70px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    #comment-input:focus { border-color: #ff6b35; }

    #compose-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }

    #reply-indicator {
      font-size: 11px;
      color: #888;
    }

    #cancel-reply {
      background: none;
      color: #aaa;
      font-size: 11px;
      padding: 2px 4px;
      display: none;
    }

    #submit-btn {
      background: #ff6b35;
      color: white;
      padding: 7px 16px;
    }

    #empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #bbb;
    }

    #empty-state p { font-size: 13px; line-height: 1.6; }

    #error-msg {
      color: #e53e3e;
      font-size: 12px;
      margin-top: 6px;
      display: none;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #bbb;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div id="header">
    <h1>Babble</h1>
    <div id="header-right">
      <span id="user-info"></span>
      <button id="logout-btn" style="display:none">logout</button>
    </div>
  </div>

  <div id="auth-section" style="display:none">
    <h2 id="auth-title">Log in to Babble</h2>
    <input type="text" id="username-input" placeholder="Username" style="display:none">
    <input type="email" id="email-input" placeholder="Email">
    <input type="password" id="password-input" placeholder="Password">
    <button id="login-btn">Log in</button>
    <button id="signup-btn">Create account</button>
    <div id="error-msg"></div>
  </div>

  <div id="url-bar"></div>

  <div id="comments-section">
    <div class="loading">Loading comments...</div>
  </div>

  <div id="compose" style="display:none">
    <textarea id="comment-input" placeholder="What do you think?"></textarea>
    <div id="compose-footer">
      <div>
        <span id="reply-indicator"></span>
        <button id="cancel-reply">cancel reply</button>
      </div>
      <button id="submit-btn">Post</button>
    </div>
  </div>

  <script src="sidebar.js"></script>
</body>
</html>
