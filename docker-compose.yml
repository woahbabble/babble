services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: babble
      POSTGRES_USER: babble
      POSTGRES_PASSWORD: babble
    volumes:
      - babble_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U babble -d babble"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      USE_HTTPS: "0"
      PORT: "3001"
      DATABASE_URL: postgres://babble:babble@db:5432/babble
      PGSSLMODE: disable
      JWT_SECRET: dev-secret-change-in-production
      CORS_ORIGINS: "*"
      ADMIN_TOKEN: admin
      API_HOST: localhost
    depends_on:
      db:
        condition: service_healthy

  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      API_URL: http://api:3001/api
      NEXT_PUBLIC_BABBLE_API_BASE: http://localhost:3001/api
    depends_on:
      - api

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@babble.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - babble_pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  babble_postgres_data:
  babble_pgadmin_data:

networks:
  default:
    name: babble-net
